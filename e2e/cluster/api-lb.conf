# Round-robin in front of the two backend replicas of the CLUSTER_MODE=multi
# E2E stack (docker-compose.e2e.yml, profile `cluster`).
#
# Deliberately has NO affinity of any kind: no ip_hash, no sticky cookie, no
# keepalive to the upstreams. Consecutive requests from one browser session land
# on alternating replicas, which is the condition the shard exists to test. A
# deployment serving 2025-era MCP clients wants the opposite (helm/README.md,
# docs/adr/0004-mcp-two-eras-request-identity-and-mrtr-confirmation.md); this
# fixture is the adversarial case, not the recommended configuration.
upstream monize_backends {
    server backend:3000;
    server backend-2:3000;
}

server {
    listen 80;
    server_name _;

    # No body cap at all. nginx's 1m default would refuse the suite's uploads
    # with a 413 the single-backend shards never produce, and any finite value
    # here is a second limit to keep in step with MNY_IMPORT_LIMIT_MB (300 by
    # default) and the restore ceiling. The app's own limits are what the suite
    # is testing; the fixture must not become the one that refuses.
    client_max_body_size 0;

    location / {
        proxy_pass http://monize_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Nothing is added about the client's address, and that is deliberate.
        # `frontend/src/lib/client-address.ts` reads X-Real-IP and the first
        # X-Forwarded-For entry as an assertion made by the deployment's edge,
        # and `frontend/src/proxy.ts` either forwards the one it was given or
        # forwards none. This hop is behind that decision, so an X-Real-IP set
        # here would be this container asserting an address nobody claimed --
        # and nginx does not append to X-Forwarded-For unless told to, so what
        # the frontend decided is what the backend sees.

        # Server-Sent Events: the relay parks a stream for minutes and writes a
        # keepalive comment every 15s. Buffering would hold those frames and the
        # answer behind nginx until the response ended, which is the opposite of
        # what the stream is for.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Which replica answered this request. `cluster.spec.ts` reads it to
        # prove both replicas served the same session, rather than inferring it
        # from container logs after the fact. E2E-only: nothing in the app reads
        # or sets it.
        add_header X-E2E-Upstream $upstream_addr always;
    }
}
