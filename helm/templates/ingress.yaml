{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monize-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "monize.frontend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ include "monize.hostname" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monize-frontend-service
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.mcp.stickySessions.enabled }}
---
# A 2025-era MCP session lives in ONE backend process and cannot be rebuilt
# elsewhere (see the class comment in backend/src/mcp/mcp-http.controller.ts), so
# with more than one backend replica its requests have to keep reaching the
# replica that answered `initialize`.
#
# This is a second Ingress rather than an annotation on the one above for two
# reasons. Affinity annotations apply to a whole Ingress, so scoping them to the
# MCP path needs its own resource; and the path has to reach the backend Service
# directly. Every other route is served by the frontend, whose middleware proxies
# to monize-backend-service with a server-side fetch -- affinity at the edge
# would pin the frontend pod and kube-proxy would still spread that fetch across
# backend replicas.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monize-mcp
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "monize.backend.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: {{ .Values.mcp.stickySessions.cookieName | quote }}
    nginx.ingress.kubernetes.io/session-cookie-path: {{ .Values.mcp.stickySessions.path | quote }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ include "monize.hostname" . | quote }}
      http:
        paths:
          - path: {{ .Values.mcp.stickySessions.path }}
            pathType: Prefix
            backend:
              service:
                name: monize-backend-service
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
